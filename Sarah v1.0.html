<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7c3aed" />
<title>Sarah — Révision Bac Pro MCV</title>
<style>
:root{
  --brand-50:#f5f3ff; --brand-100:#ede9fe; --brand-200:#ddd6fe;
  --brand-300:#c4b5fd; --brand-400:#a78bfa; --brand-500:#8b5cf6;
  --brand-600:#7c3aed; --brand-700:#6d28d9; --brand-800:#5b21b6;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0;
  --slate-300:#cbd5e1; --slate-400:#94a3b8; --slate-500:#64748b;
  --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b;
  --green-50:#f0fdf4; --green-500:#22c55e; --green-600:#16a34a;
  --rose-50:#fff1f2;  --rose-500:#f43f5e;  --rose-600:#e11d48;
  --amber-500:#f59e0b;
  --radius:14px;
  --shadow:0 4px 18px -8px rgba(76,29,149,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--brand-50) 0%,#fff 200px);color:var(--slate-800);min-height:100vh}
body{padding-bottom:72px}
#app{max-width:680px;margin:0 auto;padding:14px;min-height:100vh}
/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 14px}
.hdr .brand{font-weight:800;font-size:20px;color:var(--brand-700)}
.hdr .meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--slate-600)}
.hdr .pill{background:var(--brand-100);color:var(--brand-700);padding:4px 10px;border-radius:999px;font-weight:600}
/* Card */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.card .label{font-size:12px;color:var(--slate-500);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.muted{color:var(--slate-500);font-size:13px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.center{text-align:center}
.big{font-size:28px;font-weight:800;color:var(--brand-700)}
/* Buttons */
.btn{appearance:none;border:none;background:var(--brand-600);color:#fff;font-weight:600;font-size:15px;padding:12px 16px;border-radius:14px;width:100%;cursor:pointer;transition:transform .06s,box-shadow .15s}
.btn:hover{box-shadow:0 6px 18px -6px rgba(124,58,237,.45)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.secondary{background:#fff;color:var(--brand-700);border:1.5px solid var(--brand-300)}
.btn.ghost{background:transparent;color:var(--brand-700)}
.btn.danger{background:#fff;color:var(--rose-600);border:1.5px solid var(--rose-500)}
.btn.small{padding:8px 12px;font-size:13px;width:auto}
.chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;border:1.5px solid var(--brand-200);background:#fff;color:var(--brand-700);font-size:13px;font-weight:600;cursor:pointer}
.chip.active{background:var(--brand-600);color:#fff;border-color:var(--brand-700)}
/* Themes grid */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-btn{text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--brand-200);background:#fff;cursor:pointer;font-weight:600;font-size:13px;color:var(--slate-800)}
.theme-btn.active{background:var(--brand-600);color:#fff;border-color:var(--brand-700)}
.theme-btn .sub{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:2px}
/* Option (quiz answers) */
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--slate-200);background:#fff;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.4;transition:background .15s,border-color .15s}
.opt:hover{background:var(--brand-50)}
.opt.selected{border-color:var(--brand-500);background:var(--brand-50)}
.opt.correct{border-color:var(--green-500);background:var(--green-50);color:var(--green-600);font-weight:600}
.opt.wrong{border-color:var(--rose-500);background:var(--rose-50);color:var(--rose-600);font-weight:600}
.opt .letter{font-weight:700;margin-right:8px}
.opt[disabled]{cursor:default}
/* Tiles (Home) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{cursor:pointer;background:#fff;border-radius:var(--radius);padding:18px 10px;border:1px solid var(--slate-200);box-shadow:var(--shadow);text-align:center;transition:transform .08s}
.tile:hover{transform:translateY(-2px)}
.tile .emoji{font-size:30px;line-height:1}
.tile .ttl{font-weight:700;margin-top:6px}
.tile .sub{font-size:11px;color:var(--slate-500)}
/* Progress bar */
.bar{height:10px;background:var(--brand-100);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand-500),var(--brand-700));transition:width .3s}
/* Explanation box */
.expl{background:var(--slate-50);border-left:4px solid var(--brand-400);padding:10px 12px;border-radius:8px;font-size:13.5px;line-height:1.5}
.expl b{color:var(--brand-700)}
/* Navbar */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--slate-200);display:flex;justify-content:space-around;padding:6px 4px;z-index:50;box-shadow:0 -4px 14px -8px rgba(0,0,0,.1)}
.nav button{flex:1;background:transparent;border:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--slate-500);font-size:11px;cursor:pointer;font-weight:600;border-radius:8px;transition:color .15s}
.nav button .ic{font-size:20px;line-height:1}
.nav button.active{color:var(--brand-700)}
/* Toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--brand-700);color:#fff;padding:10px 16px;border-radius:14px;box-shadow:0 10px 30px -10px rgba(76,29,149,.4);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;z-index:100;animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
/* Onboarding */
.onb{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:18px}
.onb .box{background:#fff;border-radius:24px;box-shadow:0 30px 60px -20px rgba(76,29,149,.25);padding:24px;max-width:420px;width:100%}
.onb input{width:100%;padding:12px 14px;border:1.5px solid var(--brand-200);border-radius:12px;font-size:15px;outline:none;margin-bottom:10px}
.onb input:focus{border-color:var(--brand-500)}
/* Badges */
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bgrid .b{text-align:center;padding:10px 6px;border-radius:14px;background:var(--brand-50);border:1px solid var(--brand-200);font-size:11px}
.bgrid .b.locked{opacity:.4;filter:grayscale(.9)}
.bgrid .b .em{font-size:22px}
.bgrid .b .nm{font-weight:600;margin-top:4px;line-height:1.2}
/* Chart */
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding:6px 4px;border-bottom:1px solid var(--slate-200)}
.chart .bar-i{flex:1;background:linear-gradient(180deg,var(--brand-400),var(--brand-700));border-radius:6px 6px 0 0;min-height:2px;position:relative;display:flex;align-items:flex-start;justify-content:center}
.chart .bar-i .v{position:absolute;top:-16px;font-size:10px;color:var(--brand-700);font-weight:700}
.chart-labels{display:flex;gap:4px;font-size:10px;color:var(--slate-500);padding-top:3px}
.chart-labels span{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{width:100%;height:80px}
/* Hearts/combo */
.lives{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
/* Question header (theme/difficulty) */
.qhead{font-size:11px;color:var(--brand-600);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.qtext{font-size:15px;font-weight:600;line-height:1.45;margin:0 0 12px}
/* Survival lives */
.heart{color:var(--rose-500)}
.heartx{color:var(--slate-300)}
/* Counter */
.qcount{display:flex;justify-content:space-between;font-size:13px;color:var(--slate-600);margin-bottom:6px}
.qcount .good{color:var(--brand-700);font-weight:700}
/* Timer */
.timer{font-family:'Courier New',monospace;font-weight:800;color:var(--brand-700);font-size:18px;padding:6px 10px;border:1.5px solid var(--brand-200);border-radius:10px;background:#fff}
/* Helper */
.gap{height:8px}
.txt-c{text-align:center}
.flex{display:flex;gap:8px;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs .chip{cursor:pointer}
.section-title{font-weight:700;margin:14px 0 8px;color:var(--slate-700);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.sm{font-size:13px}
.xs{font-size:11px;color:var(--slate-500)}
hr{border:none;border-top:1px solid var(--slate-200);margin:10px 0}
@media (max-width:380px){
  .grid3{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .chip{padding:6px 10px;font-size:12px}
}
</style>
</head>

const TVA = [{l:'5,5 %',v:0.055},{l:'10 %',v:0.10},{l:'20 %',v:0.20}];
const rand = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const randF= (a,b,d=2)=>{const v=Math.random()*(b-a)+a; return Math.round(v*10**d)/10**d};
const pick = a=>a[Math.floor(Math.random()*a.length)];
const r2 = n=>Math.round(n*100)/100;
const eur = n=>n.toFixed(2).replace('.',',')+' €';
const pct = n=>n+' %';
function buildOpts(correctVal, unit){
  const fmt = unit==='%' ? (n=>n+' %') : (unit==='' ? (n=>''+n) : (unit==='jours' ? (n=>n+' jours') : (n=>n.toFixed(2).replace('.',',')+' '+unit)));
  const correctStr = fmt(correctVal);
  const distractors = new Set();
  let guard=0;
  while(distractors.size<3 && guard<40){
    guard++;
    const factor = pick([0.8,0.9,1.1,1.2,1.25,1.5,0.75]);
    const d = r2(correctVal*factor);
    if(d!==correctVal && d>0){
      const ds = fmt(d);
      if(ds!==correctStr) distractors.add(ds);
    }
  }
  const arr = [correctStr, ...distractors];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  return { options:arr, correct: arr.indexOf(correctStr) };
}

// ============ Moteur adaptatif (SRS pondéré) ============
function weightedPick(questions, mastery, n){
  const now=Date.now();
  const scored=questions.map(q=>{
    const m=mastery[q.id]||{score:0,lastSeen:0};
    const age=(now-(m.lastSeen||0))/(1000*60*60*24);
    const freq=typeof q.frequency_score==='number'?q.frequency_score:5;
    const prob=typeof q.exam_probability==='number'?q.exam_probability:.5;
    const w=(6-m.score)+Math.min(3,age*.5)+freq*.4+prob*4;
    return {q,w};
  });
  const picked=[]; const pool=scored.slice();
  for(let i=0;i<n && pool.length;i++){
    const tot=pool.reduce((s,x)=>s+x.w,0);
    let r=Math.random()*tot, idx=0;
    for(;idx<pool.length;idx++){r-=pool[idx].w; if(r<=0)break}
    idx=Math.min(idx,pool.length-1);
    picked.push(pool[idx].q);
    pool.splice(idx,1);
  }
  return picked;
}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickN(arr,n){return shuffle(arr).slice(0,n)}

function buildSession({themeId='all', count=10, mastery={}, mode='adaptive'}){
  let pool;
  if(themeId==='all') pool=getAllQuestions();
  else if(themeId==='general') pool=getQuestionsByCategory('general');
  else if(themeId==='pro') pool=getQuestionsByCategory('pro');
  else pool=getQuestionsByTheme(themeId);
  if(!pool||!pool.length) return [];
  if(mode==='random' || mode==='exam') return pickN(pool,count);
  return weightedPick(pool, mastery, count);
}
function buildExam(){ return pickN(getAllQuestions(), 20) }

function xpForLevel(l){return 50*(l-1)*l}
function levelFromXp(xp){let l=1; while(xp>=xpForLevel(l+1)) l++; return l}
function levelProgress(xp){
  const l=levelFromXp(xp), cur=xpForLevel(l), next=xpForLevel(l+1);
  const within=xp-cur, span=next-cur;
  return {level:l, xp, within, span, percent:Math.min(100,(within/span)*100)};
}

const STORAGE_KEY = 'sarah-state-v1';
const INITIAL = {
  onboarded:false, name:'', goal:'BAC Pro MCV — juin 2026',
  xp:0, combo:0, maxCombo:0, streak:0, lastDay:null,
  mastery:{}, errors:[], badges:[], newBadges:[], history:[],
  examsTaken:0, oralDone:0, survivalBest:0,
  settings:{sound:true, haptics:true, dark:false}
};
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return {...INITIAL};
    const j=JSON.parse(raw);
    return {...INITIAL, ...(j.state||j)};
  }catch(e){return {...INITIAL}}
}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY, JSON.stringify({state:STATE, version:1}))}catch(e){}
}
let STATE = loadState();

function todayKey(){return new Date().toISOString().slice(0,10)}
function tickStreak(){
  const t=todayKey();
  if(STATE.lastDay===t) return;
  if(!STATE.lastDay){STATE.lastDay=t; STATE.streak=1; saveState(); return}
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(STATE.lastDay===y){STATE.streak+=1}else{STATE.streak=1}
  STATE.lastDay=t; saveState();
}

function answerQuestion(q, ok){
  const m={...STATE.mastery};
  const e=m[q.id]||{score:0,lastSeen:0,correct:0,wrong:0};
  if(ok){e.score=Math.min(5,e.score+1); e.correct++}
  else  {e.score=Math.max(0,e.score-1); e.wrong++}
  e.lastSeen=Date.now();
  m[q.id]=e;
  STATE.mastery=m;
  STATE.combo = ok ? STATE.combo+1 : 0;
  STATE.maxCombo = Math.max(STATE.maxCombo, STATE.combo);
  if(ok){
    STATE.xp += XP_PER_CORRECT;
    if(STATE.combo>=3) STATE.xp += XP_BONUS_STREAK;
  }
  if(!ok && !STATE.errors.includes(q.id)) STATE.errors=[...STATE.errors, q.id];
  else if(ok && STATE.errors.includes(q.id) && e.score>=3) STATE.errors=STATE.errors.filter(x=>x!==q.id);
  checkBadges();
  saveState();
}
function logSession(themeId, correct, total){
  STATE.history = [...STATE.history, {date:todayKey(), themeId, correct, total, t:Date.now()}].slice(-200);
  checkBadges();
  saveState();
}

  STATE.examsTaken += 1;
  STATE.xp += (score20>=10 ? XP_EXAM_PASS : Math.round(score20*5));
  checkBadges(score20);

}
function addOralDone(){ STATE.oralDone+=1; checkBadges(); saveState() }
function recordSurvival(n){ STATE.survivalBest = Math.max(STATE.survivalBest,n); checkBadges(); saveState() }
function checkBadges(examScore20){
  const have=new Set(STATE.badges); const give=[];
  const add=id=>{if(!have.has(id)){have.add(id); give.push(id)}};
  if(STATE.history.length>=1) add('first_quiz');
  if(STATE.streak>=3) add('streak_3');
  if(STATE.streak>=7) add('streak_7');
  if(STATE.streak>=30) add('streak_30');
  if(STATE.maxCombo>=5) add('combo_5');
  if(STATE.maxCombo>=10) add('combo_10');
  if(examScore20!==undefined && examScore20>=12) add('exam_pass');
  if(examScore20!==undefined && examScore20>=16) add('exam_excellent');
  if(STATE.oralDone>=5) add('oral_pro');
  if(STATE.survivalBest>=20) add('survivor');
  const lvl=levelFromXp(STATE.xp);
  if(lvl>=5) add('level_5');
  if(lvl>=10) add('level_10');
  const last = STATE.history[STATE.history.length-1];
  if(last && last.total>=5 && last.correct===last.total) add('no_error');
  const themePerf=prefix=>{
    const ids=Object.keys(STATE.mastery).filter(k=>k.startsWith(prefix));
    if(ids.length<5) return 0;
    const ok=ids.reduce((a,k)=>a+(STATE.mastery[k].score>=4?1:0),0);
    return ok/ids.length;
  };
  if(themePerf('soncas_')>=0.9) add('theme_master_soncas');
  if(themePerf('cap_')>=0.9) add('theme_master_cap');
  if(themePerf('marges_')>=0.9) add('theme_master_marges');
  if(give.length){
    STATE.badges = Array.from(have);
    STATE.newBadges = [...(STATE.newBadges||[]), ...give];
    give.forEach(id=>showToast(badgeById(id)));
  }
}

// ============ Rendering helpers ============
function h(tag, attrs={}, children=[]){
  const el=document.createElement(tag);
  for(const k in attrs){
    const v=attrs[k];
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='style' && typeof v==='object'){Object.assign(el.style,v)}
    else el.setAttribute(k,v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null||c===false) return;
    if(typeof c==='string'||typeof c==='number') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}
function el(html){
  const t=document.createElement('template'); t.innerHTML=html.trim();
  return t.content.firstChild;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild) }

// ----- QuestionCard helper (vue) -----
function renderQuestionCard(q, opts={}){
  // opts: onAnswer(ok, idx), showExplanation
  const showExplanation = opts.showExplanation !== false;
  const card=h('div',{class:'card'});
  card.appendChild(el(`<div class="qhead">${q.theme||''} · ${q.difficulty||'standard'}</div>`));
  card.appendChild(el(`<h3 class="qtext">${escapeHtml(q.q)}</h3>`));
  const list=h('div');
  let picked=null, revealed=false;
  const buttons=[];
  q.options.forEach((opt,i)=>{
    const b=h('button',{class:'opt',onClick:()=>{
      if(revealed) return;
      picked=i;
      buttons.forEach((bb,bi)=>{bb.classList.toggle('selected', bi===i)});
      validate.disabled=false;
    }});
    b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span>${escapeHtml(opt)}`;
    buttons.push(b);
    list.appendChild(b);
  });
  card.appendChild(list);
  const validate = h('button',{class:'btn',disabled:'disabled',onClick:()=>{
    if(picked===null) return;
    revealed=true;
    buttons.forEach((b,i)=>{
      b.disabled=true;
      if(i===q.correct) b.classList.add('correct');
      else if(i===picked) b.classList.add('wrong');
      b.classList.remove('selected');
    });
    validate.style.display='none';
    if(showExplanation && q.explanation){
      const ex=h('div',{class:'expl'});
      ex.innerHTML=`<b>Explication :</b> ${escapeHtml(q.explanation)}`;
      card.appendChild(ex);
    }
    opts.onAnswer && opts.onAnswer(picked===q.correct, picked);
  }},'Valider');
  card.appendChild(validate);
  return card;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

    if(CURRENT_CTX.timerId) clearInterval(CURRENT_CTX.timerId);

      CURRENT_CTX.seconds--;
      if(CURRENT_CTX.seconds<=0){

      const t=document.getElementById('exam-timer');
      if(t){const m=Math.floor(CURRENT_CTX.seconds/60), s=CURRENT_CTX.seconds%60;

    if(CURRENT_CTX.timerId) clearInterval(CURRENT_CTX.timerId);

// ----- Errors -----
function pageErrors(){
  CURRENT_CTX = Object.assign({i:0}, CURRENT_CTX);
  const wrap=h('div');
  const qs = STATE.errors.map(getQuestionById).filter(Boolean);
  if(!qs.length){
    wrap.appendChild(el(`
      <div class="card txt-c">
        <div style="font-size:40px">🎉</div>
        <div style="font-weight:700;margin:6px 0">Aucune erreur à revoir !</div>
        <p class="muted">Continue de réviser pour rester au top.</p>
      </div>`));
    wrap.appendChild(h('button',{class:'btn secondary',onClick:()=>navigate('home')},'Accueil'));
    return wrap;
  }
  if(CURRENT_CTX.i>=qs.length) CURRENT_CTX.i=qs.length-1;
  const q=qs[CURRENT_CTX.i];
  wrap.appendChild(el(`<div class="xs" style="margin-bottom:6px">Erreur ${CURRENT_CTX.i+1} / ${qs.length}</div>`));
  wrap.appendChild(renderQuestionCard(q,{onAnswer:(ok)=>{answerQuestion(q,ok)}}));
  const row=h('div',{class:'row'});
  row.appendChild(h('button',{class:'btn secondary',disabled:CURRENT_CTX.i===0?'disabled':null,onClick:()=>{CURRENT_CTX.i--;render()}},'← Précédente'));
  row.appendChild(h('button',{class:'btn',disabled:CURRENT_CTX.i+1>=qs.length?'disabled':null,onClick:()=>{CURRENT_CTX.i++;render()}},'Suivante →'));
  wrap.appendChild(row);
  return wrap;
}

// ----- Stats -----
function pageStats(){
  const themes=listThemes();
  const themeStats=themes.map(t=>{
    const ids=Object.keys(STATE.mastery).filter(k=>k.startsWith(t.id+'_'));
    const sumScore=ids.reduce((a,k)=>a+(STATE.mastery[k]?.score||0),0);
    const avg=ids.length?Math.round((sumScore/ids.length)*20):0;
    return {label:t.name.slice(0,7), value:avg};
  });
  const last20 = STATE.history.slice(-20).map(h=>Math.round((h.correct/h.total)*100));
  const wrap=h('div');
  wrap.appendChild(el(`
    <div class="card">
      <div class="grid2 center">
        <div><div class="big">${STATE.examsTaken}</div><div class="xs">Examens passés</div></div>
        <div><div class="big">${STATE.oralDone}</div><div class="xs">Scénarios oraux</div></div>
        <div><div class="big">${STATE.maxCombo}</div><div class="xs">Meilleur combo</div></div>
        <div><div class="big">${STATE.survivalBest}</div><div class="xs">Record survie</div></div>
      </div>
    </div>
  `));
  // BarChart
  const c=h('div',{class:'card'});
  c.appendChild(el(`<div class="section-title">Maîtrise par thème (/ 100)</div>`));
  const max=100;
  const chart=h('div',{class:'chart'});
  themeStats.forEach(s=>{
    const height=Math.max(2,Math.round((s.value/max)*130));
    const bar=h('div',{class:'bar-i',style:'height:'+height+'px'},[h('span',{class:'v'},String(s.value))]);
    chart.appendChild(bar);
  });
  c.appendChild(chart);
  const labels=h('div',{class:'chart-labels'});
  themeStats.forEach(s=>{labels.appendChild(h('span',{},s.label))});
  c.appendChild(labels);
  wrap.appendChild(c);
  // SparkLine
  const sl=h('div',{class:'card'});
  sl.appendChild(el(`<div class="section-title">% de bonnes réponses — 20 dernières séances</div>`));
  if(!last20.length){sl.appendChild(el(`<div class="muted sm">Aucune séance enregistrée pour l'instant.</div>`))}
  else{
    const svg = `<svg class="spark" viewBox="0 0 200 80" preserveAspectRatio="none">
      <polyline fill="none" stroke="var(--brand-600)" stroke-width="2" points="${last20.map((v,i)=>(i*(200/(last20.length-1||1)))+','+(80-(v/100)*78)).join(' ')}"/>
    </svg>`;
    sl.appendChild(el(svg));
  }
  wrap.appendChild(sl);
  return wrap;
}

// ----- Progression -----
function pageProgression(){
  const lp = levelProgress(STATE.xp);
  const wrap=h('div');
  wrap.appendChild(el(`
    <div class="card">
      <div class="label">Niveau</div>
      <div style="font-size:28px;font-weight:800;color:var(--brand-700)">${lp.level} — ${rankLabel(lp.level)}</div>
      <div class="bar" style="margin-top:8px"><span style="width:${lp.percent}%"></span></div>
      <div class="xs" style="margin-top:4px">${lp.within} / ${lp.span} XP pour le niveau ${lp.level+1}</div>
    </div>
  `));
  const c=h('div',{class:'card'});
  c.appendChild(el(`<div class="section-title">Badges (${STATE.badges.length} / ${BADGES.length})</div>`));
  const grid=h('div',{class:'bgrid'});
  BADGES.forEach(b=>{
    const has=STATE.badges.includes(b.id);
    grid.appendChild(el(`<div class="b${has?'':' locked'}" title="${escapeHtml(b.desc)}"><div class="em">${b.emoji}</div><div class="nm">${escapeHtml(b.name)}</div></div>`));
  });
  c.appendChild(grid);
  wrap.appendChild(c);
  return wrap;
}

// ----- Settings -----
function pageSettings(){
  const wrap=h('div');
  wrap.appendChild(el(`
    <div class="card">
      <div class="label">Profil</div>
      <div class="sm">Prénom : <b>${escapeHtml(STATE.name||'-')}</b></div>
      <div class="sm">Objectif : <b>${escapeHtml(STATE.goal||'-')}</b></div>
    </div>
  `));
  const p=h('div',{class:'card'});
  p.appendChild(el(`<div class="section-title">Préférences</div>`));
  const r1=h('label',{class:'flex-between sm',style:'padding:4px 0'},[h('span',{},'Son'),h('input',{type:'checkbox',checked:STATE.settings.sound?'checked':null,onChange:e=>{setSetting('sound',e.target.checked)}})]);
  const r2=h('label',{class:'flex-between sm',style:'padding:4px 0'},[h('span',{},'Vibrations'),h('input',{type:'checkbox',checked:STATE.settings.haptics?'checked':null,onChange:e=>{setSetting('haptics',e.target.checked)}})]);
  p.appendChild(r1); p.appendChild(r2);
  wrap.appendChild(p);

  const d=h('div',{class:'card'});
  d.appendChild(el(`<div class="section-title">Données</div>`));
  d.appendChild(h('button',{class:'btn secondary',style:'margin-bottom:6px',onClick:doExport},'Exporter mes données (JSON)'));
  const fileInput=h('input',{type:'file',accept:'application/json',style:'display:none',onChange:doImport});
  d.appendChild(h('button',{class:'btn secondary',style:'margin-bottom:6px',onClick:()=>fileInput.click()},'Importer un fichier'));
  d.appendChild(fileInput);
  d.appendChild(h('button',{class:'btn danger',onClick:doReset},'Tout réinitialiser'));
  wrap.appendChild(d);

  wrap.appendChild(el(`<div class="txt-c xs" style="margin-top:8px">Sarah v1.1 — 100% local — un seul fichier HTML</div>`));
  return wrap;

  function doExport(){
    try{
      const data={...STATE};
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='sarah-export-'+todayKey()+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(e){alert('Erreur export : '+e.message)}
  }
  function doImport(e){
    const f=e.target.files?.[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{const j=JSON.parse(ev.target.result); importAll(j); alert('Importé !'); render()}
      catch{alert('Fichier invalide')}
    };
    reader.readAsText(f);
  }
  function doReset(){
    if(confirm('Effacer toutes les données ? Cette action est irréversible.')){
      hardReset(); render();
    }
  }
}

// ============ Render principal ============
function render(){
  const app=document.getElementById('app');
  clear(app);
  if(!STATE.onboarded){
    app.appendChild(pageOnboarding());
    document.getElementById('nav-mount').innerHTML='';
    return;
  }
  app.appendChild(renderHeader());
  let view;
  switch(CURRENT_ROUTE){
    case 'revise':      view=pageRevise();      break;
    case 'exam':        view=pageExam();        break;
    case 'oral':        view=pageOral();        break;
    case 'survival':    view=pageSurvival();    break;
    case 'errors':      view=pageErrors();      break;
    case 'stats':       view=pageStats();       break;
    case 'progression': view=pageProgression(); break;
    case 'settings':    view=pageSettings();    break;
    default:            view=pageHome();
  }
  app.appendChild(view);
  renderNav();
}

// ============ Boot ============
tickStreak();
render();
</script>
</body>
</html>
